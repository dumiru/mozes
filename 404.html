<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ====== FAVICON LINK ====== -->
  <link rel="icon" type="image" href="https://ik.imagekit.io/mozes/Logos/fav"></link>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Mozes Growth Agency</title>
  <meta name="description" content="The page you're looking for doesn't exist or has been moved. Head back to the Mozes Growth Agency homepage.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- ====== ALL STYLES ====== -->
  <link rel="stylesheet" href="styles.css">

  <!-- ====== PAGE-SPECIFIC STYLES ====== -->
  <style>
    .error-hero {
      padding: 160px 0 90px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .error-hero .wrap { max-width: 720px; }
    .error-code {
      font-size: clamp(64px, 10vw, 120px);
      font-weight: 500;
      line-height: 1;
      margin: 0 0 10px;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .error-hero .eyebrow { display: flex; justify-content: center; }
    .error-hero .section-title { margin: 0 0 16px; }
    .error-hero .section-sub { margin: 0 auto 34px; text-align: center; }
    .error-hero .btn-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .error-links { background: var(--white); }
    .error-links .wrap { max-width: 640px; text-align: center; }
    .error-links .head-row { justify-content: center; text-align: center; display: block; }
    .error-links .section-sub { margin: 0 auto 8px; }
    .error-links .link-row {
      display: flex;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- ====== NAVBAR (injected by navbar.js) ====== -->
  <header class="navbar" id="navbarRoot"></header>

  <main id="home">

    <!-- ============================================================
         404 NOTICE
         ============================================================ -->
    <section class="error-hero">
      <div class="wrap">
        <div class="error-code">404</div>
        <p class="eyebrow">Page not found</p>
        <h1 class="section-title">We couldn't find that page</h1>
        <p class="section-sub">The page you're looking for may have been moved, renamed, or no longer exists. Let's get you back on track.</p>
        <div class="btn-row">
          <a href="/index.html" class="btn">Back to Home</a>
        </div>
      </div>
    </section>

  </main>

  <!-- ====== FOOTER (injected by footer.js) ====== -->
  <footer id="footerRoot"></footer>

  <!-- ====== ALL SCRIPTS ====== -->
  <script src="scripts.js" defer></script>
</body>
</html>

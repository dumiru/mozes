      </div>
      <div class="hero-scrim"></div>
      <div class="hero-content summit-hero-content">
        <span class="tag">Coming Soon</span>
        <h1>Mozes Summit 2026 in Colombo...</h1>
        <p>Build the partnerships in Colombo, that carry into next year.</p>

        <div class="summit-meta">
          <span><svg viewBox="0 0 24 24" stroke="currentColor" fill="none"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="16" y1="2" x2="16" y2="6"></line></svg>This December</span>

          <div class="c-unit"><span class="c-num" data-c-mins>--</span><span class="c-label">Mins</span></div>
          <span class="c-sep">:</span>
          <div class="c-unit"><span class="c-num" data-c-secs>--</span><span class="c-label">Secs</span></div>
